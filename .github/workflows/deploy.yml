name: CI/CD React Pipeline PRONTOFY_LINKS

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    # 1. CORREÇÃO CRUCIAL: Aponta para o ambiente correto onde as chaves estão salvas
    environment: ENV_FILE
    
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Converter nome do repositório para minúsculas
        run: echo "REPO_LOWERCASE=${GITHUB_REPOSITORY,,}" >> ${GITHUB_ENV}

      # 2. GERAR O ARQUIVO .ENV.PRODUCTION
      # Como definimos o environment acima, o GitHub agora terá acesso a esses valores.
      - name: Injetar Variáveis de Ambiente
        run: |
          echo "VITE_N8N_WEBHOOK_URL=${{ secrets.VITE_N8N_WEBHOOK_URL }}" >> .env.production
          echo "VITE_SUPABASE_MARKETING_PUBLISHABLE_KEY=${{ secrets.VITE_SUPABASE_MARKETING_PUBLISHABLE_KEY }}" >> .env.production
          echo "VITE_SUPABASE_MARKETING_URL=${{ secrets.VITE_SUPABASE_MARKETING_URL }}" >> .env.production
          echo "VITE_SUPABASE_PUBLISHABLE_KEY=${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}" >> .env.production
          echo "VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}" >> .env.production

      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e Push da Imagem
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/${{ env.REPO_LOWERCASE }}:latest
          # A seção build-args foi totalmente removida. O Vite vai ler o .env.production gerado no passo anterior.

      - name: Disparar Webhook do Easypanel
        run: curl -X POST "${{ secrets.EASYPANEL_WEBHOOK_URL }}"
